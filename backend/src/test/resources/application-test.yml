spring:
  application:
    name: backend-test

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - openid
              - profile
              - email


  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver


  data:
    redis:
      host: localhost
      port: 6379


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false


  flyway:
    enabled: false


  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest


jwt:
  secret: test-secret-key-for-tests-only-12345678901234567890
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

app:
  oauth2:
    redirect-uri: http://localhost:4200/auth/callback